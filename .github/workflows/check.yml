name: Update YouTube Version

on:
  workflow_dispatch:
  #schedule:
  #  - cron: "40 15 * * *"

jobs:
  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install cloudscraper beautifulsoup4

      - name: Run updater
        run: |
          python - << 'EOF'
          import cloudscraper
          import re
          import os
          import sys
          from bs4 import BeautifulSoup

          scraper = cloudscraper.create_scraper(
              browser={
                  'browser': 'chrome',
                  'platform': 'windows',
                  'desktop': True
              }
          )

          def parse_version_tuple(v_str):
              try:
                  return tuple(map(int, v_str.strip().split('.')))
              except ValueError:
                  return (0,)

          found_versions = set()

          # Regex mới: Linh hoạt số chữ số ở từng phân đoạn (ví dụ: 21.32.2, 21.31.254 đều khớp)
          VERSION_REGEX = r'\b([1-9][0-9]\.[0-9]+\.[0-9]+)\b'

          uptodown_urls = [
              "https://youtube.en.uptodown.com/android/versions",
              "https://youtube.en.uptodown.com/android"
          ]

          for url in uptodown_urls:
              try:
                  res = scraper.get(url, timeout=15)
                  print(f"[Uptodown] Fetching {url} -> Status: {res.status_code}")
                  if res.status_code == 200:
                      soup = BeautifulSoup(res.text, 'html.parser')
                      
                      # Quét qua các thẻ chứa phiên bản
                      for el in soup.find_all(class_=re.compile(r'version', re.I)):
                          text = el.get_text(strip=True)
                          m = re.search(VERSION_REGEX, text)
                          if m:
                              found_versions.add(m.group(1))
                      
                      # Quét Regex toàn bộ trang HTML
                      matches = re.findall(VERSION_REGEX, res.text)
                      for m in matches:
                          found_versions.add(m)
              except Exception as e:
                  print(f"[Uptodown] Error: {e}")

          # Dự phòng APKMirror nếu Uptodown không có dữ liệu
          if not found_versions:
              try:
                  apkmirror_url = "https://www.apkmirror.com/uploads/?appcategory=youtube"
                  res = scraper.get(apkmirror_url, timeout=15)
                  print(f"[APKMirror] Fetching -> Status: {res.status_code}")
                  if res.status_code == 200:
                      matches = re.findall(VERSION_REGEX, res.text)
                      for m in matches:
                          found_versions.add(m)
              except Exception as e:
                  print(f"[APKMirror] Error: {e}")

          # Lọc các phiên bản hợp lệ (chỉ lấy bản từ 18.x.x trở lên để tránh bắt nhầm chuỗi số khác)
          valid_versions = [v for v in found_versions if parse_version_tuple(v) >= (18, 0, 0)]

          if not valid_versions:
              print("Critical Error: Could not extract any valid version.")
              sys.exit(1)

          # Lấy phiên bản lớn nhất
          latest_version = max(valid_versions, key=parse_version_tuple)
          print(f"All candidates found: {sorted(valid_versions, key=parse_version_tuple, reverse=True)[:10]}")
          print(f"==> Selected Latest Version: {latest_version}")

          # Đọc phiên bản cũ
          old_version = ""
          if os.path.exists("version.txt"):
              with open("version.txt", "r") as f:
                  old_version = f.read().strip()

          if latest_version == old_version:
              print("No version change detected -> skipping update.")
              sys.exit(0)

          # Lưu phiên bản mới
          with open("version.txt", "w") as f:
              f.write(latest_version)

          # Cập nhật config.toml
          content = ""
          if os.path.exists("config.toml"):
              with open("config.toml", "r") as f:
                  content = f.read()

          new_content, replacements = re.subn(
              r'(?m)^version\s*=\s*".*?"',
              f'version = "{latest_version}"',
              content
          )

          if replacements == 0:
              print("No existing 'version' line found -> appending to config.toml")
              new_content = new_content.strip() + f'\nversion = "{latest_version}"\n'

          with open("config.toml", "w") as f:
              f.write(new_content)

          print(f"Successfully updated config files to version {latest_version}")
          EOF

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add version.txt config.toml

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            VERSION=$(cat version.txt)
            git commit -m "update YouTube version to $VERSION"
            git push
          fi
