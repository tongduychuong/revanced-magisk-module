name: Update YouTube Version

on:
  workflow_dispatch:
  schedule:
    - cron: "40 15 * * *"

jobs:
  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run updater
        run: |
          python - << 'EOF'
          import requests
          import re
          import os
          import sys
          from bs4 import BeautifulSoup

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
              "Accept-Language": "en-US,en;q=0.9",
          }

          def parse_version_tuple(v_str):
              try:
                  return tuple(map(int, v_str.split('.')))
              except ValueError:
                  return (0,)

          def get_version_from_uptodown():
              url = "https://youtube.en.uptodown.com/android/versions"
              try:
                  res = requests.get(url, headers=HEADERS, timeout=10)
                  if res.status_code == 200:
                      matches = re.findall(r'\b([1-9][0-9]\.[0-9]{2}\.[0-9]{2,3})\b', res.text)
                      if matches:
                          latest = max(set(matches), key=parse_version_tuple)
                          print(f"[Uptodown] Detected version: {latest}")
                          return latest
                  else:
                      print(f"[Uptodown] Blocked with HTTP Status {res.status_code}")
              except Exception as e:
                  print(f"[Uptodown] Error: {e}")
              return None

          def get_version_from_apkpure():
              url = "https://apkpure.net/youtube/com.google.android.youtube"
              try:
                  res = requests.get(url, headers=HEADERS, timeout=10)
                  if res.status_code == 200:
                      matches = re.findall(r'\b([1-9][0-9]\.[0-9]{2}\.[0-9]{2,3})\b', res.text)
                      if matches:
                          latest = max(set(matches), key=parse_version_tuple)
                          print(f"[APKPure] Detected version: {latest}")
                          return latest
                  else:
                      print(f"[APKPure] Blocked with HTTP Status {res.status_code}")
              except Exception as e:
                  print(f"[APKPure] Error: {e}")
              return None

          def get_version_from_apkcombo():
              url = "https://apkcombo.com/youtube/com.google.android.youtube/"
              try:
                  res = requests.get(url, headers=HEADERS, timeout=10)
                  if res.status_code == 200:
                      matches = re.findall(r'\b([1-9][0-9]\.[0-9]{2}\.[0-9]{2,3})\b', res.text)
                      if matches:
                          latest = max(set(matches), key=parse_version_tuple)
                          print(f"[APKCombo] Detected version: {latest}")
                          return latest
                  else:
                      print(f"[APKCombo] Blocked with HTTP Status {res.status_code}")
              except Exception as e:
                  print(f"[APKCombo] Error: {e}")
              return None

          # Thử lần lượt các nguồn
          version = get_version_from_uptodown() or get_version_from_apkpure() or get_version_from_apkcombo()

          if not version:
              print("Critical: Failed to fetch version from all sources.")
              sys.exit(1)

          print(f"Final selected version: {version}")

          # Đọc phiên bản cũ
          old_version = ""
          if os.path.exists("version.txt"):
              with open("version.txt", "r") as f:
                  old_version = f.read().strip()

          if version == old_version:
              print("No version change detected -> skipping update.")
              sys.exit(0)

          # Lưu phiên bản mới vào version.txt
          with open("version.txt", "w") as f:
              f.write(version)

          # Cập nhật file config.toml
          content = ""
          if os.path.exists("config.toml"):
              with open("config.toml", "r") as f:
                  content = f.read()

          new_content, replacements = re.subn(
              r'(?m)^version\s*=\s*".*?"',
              f'version = "{version}"',
              content
          )

          if replacements == 0:
              print("No existing 'version' line found -> appending to config.toml")
              new_content = new_content.strip() + f'\nversion = "{version}"\n'

          with open("config.toml", "w") as f:
              f.write(new_content)

          print(f"Successfully updated config files to version {version}")
          EOF

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add version.txt config.toml

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            VERSION=$(cat version.txt)
            git commit -m "chore: update YouTube version to $VERSION"
            git push
          fi
